<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Lato, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10"
            markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10"
            markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="420" rx="10" fill="#f8fafc"/>

  <!-- terrestrial background -->
  <path d="M 40,300 H 860 V 370 H 40 Z" fill="#22c55e" opacity="0.10"/>
  <text x="52" y="356" font-size="12.5" fill="#166534">terrestrial: riparian soil, litter, canopy</text>

  <!-- stream: narrow upstream, pond behind dam, narrow downstream -->
  <path d="M 60,150 H 300 C 340,150 350,110 400,110 H 470 C 520,110 530,150 570,150
           H 620 V 210 H 570 C 530,210 520,250 470,250 H 400 C 350,250 340,210 300,210 H 60 Z"
        fill="#3b82f6" opacity="0.28"/>
  <path d="M 60,150 H 300 C 340,150 350,110 400,110 H 470 C 520,110 530,150 570,150 H 620"
        fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M 60,210 H 300 C 340,210 350,250 400,250 H 470 C 520,250 530,210 570,210 H 620"
        fill="none" stroke="#1d4ed8" stroke-width="2"/>

  <!-- dam -->
  <rect x="612" y="140" width="18" height="80" rx="3" fill="#78350f"/>
  <g stroke="#92400e" stroke-width="3" stroke-linecap="round">
    <line x1="606" y1="150" x2="636" y2="158"/>
    <line x1="606" y1="172" x2="636" y2="164"/>
    <line x1="606" y1="192" x2="636" y2="200"/>
    <line x1="606" y1="210" x2="636" y2="204"/>
  </g>
  <text x="621" y="130" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">dam</text>

  <!-- downstream reach -->
  <path d="M 640,168 H 850 V 196 H 640 Z" fill="#3b82f6" opacity="0.28"/>
  <line x1="640" y1="168" x2="850" y2="168" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="640" y1="196" x2="850" y2="196" stroke="#1d4ed8" stroke-width="2"/>

  <!-- flow direction -->
  <line x1="70" y1="92" x2="240" y2="92" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="70" y="80" font-size="12.5" fill="#334155">flow direction</text>

  <!-- pond label -->
  <text x="435" y="185" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">beaver pond</text>
  <text x="435" y="203" font-size="11.5" fill="#1e40af" text-anchor="middle">longer water residence time</text>

  <!-- sampling points -->
  <circle cx="150" cy="180" r="9" fill="#b91c1c"/>
  <text x="150" y="138" font-size="13" font-weight="600" fill="#b91c1c" text-anchor="middle">upstream</text>
  <text x="150" y="122" font-size="11.5" fill="#7f1d1d" text-anchor="middle">DOC in</text>

  <circle cx="770" cy="182" r="9" fill="#b91c1c"/>
  <text x="770" y="138" font-size="13" font-weight="600" fill="#b91c1c" text-anchor="middle">downstream</text>
  <text x="770" y="122" font-size="11.5" fill="#7f1d1d" text-anchor="middle">DOC out</text>

  <!-- the outcome -->
  <rect x="330" y="308" width="230" height="54" rx="8" fill="#ffffff" stroke="#be185d" stroke-width="2.5"/>
  <text x="445" y="331" font-size="15" font-weight="700" fill="#be185d" text-anchor="middle">ΔDOC = down − up</text>
  <text x="445" y="351" font-size="11.5" fill="#9d174d" text-anchor="middle">&gt; 0 source · &lt; 0 sink · = 0 no effect</text>

  <path d="M 150,196 C 150,270 260,300 328,325" fill="none" stroke="#475569" stroke-width="1.8"
        stroke-dasharray="5 4" marker-end="url(#a)"/>
  <path d="M 770,198 C 770,270 640,300 564,325" fill="none" stroke="#475569" stroke-width="1.8"
        stroke-dasharray="5 4" marker-end="url(#a)"/>

  <!-- carbon sources -->
  <path d="M 300,300 C 330,275 360,260 400,252" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#ag)"/>
  <text x="250" y="292" font-size="12" fill="#166534">terrestrial input</text>

  <path d="M 470,120 C 500,105 530,100 560,100" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#ag)"/>
  <text x="566" y="96" font-size="12" fill="#166534">aquatic primary production</text>
</svg>
